Enter<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>❤️ Pour Trinix | Une Expérience Interactive par ILara ❤️</title>

    <!-- SEO & Meta Tags -->
    <meta name="description" content="Une lettre d'amour interactive et immersive pour Trinix, conçue avec tendresse par ILara.">
    <meta name="keywords" content="Trinix, ILara, Amour, Lettre Interactive, Expérience Web, Romance">
    <meta name="author" content="ILara">
    <meta name="theme-color" content="#17082c">
    <meta name="color-scheme" content="dark">
    <meta name="robots" content="index, follow">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://votre-domaine.com/">
    <meta property="og:title" content="❤️ Pour Trinix ❤️">
    <meta property="og:description" content="Une lettre d'amour interactive pour Trinix, écrite par ILara.">
    <meta property="og:image" content="assets/og-image.jpg">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://votre-domaine.com/">
    <meta property="twitter:title" content="❤️ Pour Trinix ❤️">
    <meta property="twitter:description" content="Une lettre d'amour interactive pour Trinix, écrite par ILara.">
    <meta property="twitter:image" content="assets/og-image.jpg">

    <!-- Favicon -->
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">

    <!-- Preconnect & Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Great+Vibes&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- Core Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Skip link for keyboard accessibility -->
    <a href="#app" class="skip-link">Passer au contenu</a>

    <noscript>
        <div class="noscript-fallback">
            <div class="noscript-content">
                <h1>❤️ Pour Trinix ❤️</h1>
                <p>Cette expérience cinématographique nécessite JavaScript pour prendre vie.</p>
                <p>Veuillez activer JavaScript dans les réglages de votre navigateur pour continuer.</p>
            </div>
        </div>
    </noscript>

    <!-- ============ AMBIENT LAYERS (persistent across scenes) ============ -->
    <canvas id="sky-canvas" aria-hidden="true"></canvas>
    <div id="fx-layer" aria-hidden="true"></div>

    <main id="app" role="main">
        
        <!-- ============ SCENE 0 : LOADER ============ -->
        <section class="scene active" id="scene-loader" data-scene="loader" aria-label="Chargement">
            <div class="loader-wrap">
                <div class="loader-heart" aria-hidden="true">
                    <svg viewBox="0 0 32 29" fill="currentColor">
                        <path d="M16 29 C16 29 0 18.5 0 8.7 C0 2.8 4.6 0 8.6 0 C12 0 14.7 2 16 4.8 C17.3 2 20 0 23.4 0 C27.4 0 32 2.8 32 8.7 C32 18.5 16 29 16 29Z"/>
                    </svg>
                </div>
                <p class="loader-label">Prise de contact avec les étoiles<span class="dots"><span>.</span><span>.</span><span>.</span></span></p>
                <div class="loader-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                    <div class="loader-bar-fill" id="loader-fill"></div>
                </div>
            </div>
        </section>

        <!-- ============ SCENE 1 : OPENING CINEMATIC ============ -->
        <section class="scene" id="scene-opening" data-scene="opening">
            <div class="opening-stage">
                <div class="character-slot" id="slot-opening"></div>
                <div class="dialogue-box glass" id="opening-dialogue-box">
                    <div class="dialogue-content">
                        <p class="dialogue-text" id="opening-dialogue-text" aria-live="polite"></p>
                    </div>
                    <button class="tap-hint" id="opening-next" aria-label="Continuer le dialogue">
                        <span>continuer</span>
                        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                            <path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>
                </div>
            </div>
        </section>

        <!-- ============ SCENE 2 : PASSWORD ============ -->
        <section class="scene" id="scene-password" data-scene="password">
            <div class="password-stage glass" id="password-stage">
                <h2 class="password-title">Entrez le code secret</h2>
                <div class="password-dots" id="password-dots" aria-hidden="true">
                    <span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
                </div>
                <p class="password-msg" id="password-msg" role="status">&nbsp;</p>
                <div class="keypad" id="keypad">
                    <button class="key" data-key="1" type="button">1</button>
                    <button class="key" data-key="2" type="button">2</button>
                    <button class="key" data-key="3" type="button">3</button>
                    <button class="key" data-key="4" type="button">4</button>
                    <button class="key" data-key="5" type="button">5</button>
                    <button class="key" data-key="6" type="button">6</button>
                    <button class="key" data-key="7" type="button">7</button>
                    <button class="key" data-key="8" type="button">8</button>
                    <button class="key" data-key="9" type="button">9</button>
                    <span class="key key-ghost" aria-hidden="true"></span>
                    <button class="key" data-key="0" type="button">0</button>
                    <button class="key key-del" data-key="del" aria-label="Effacer le dernier chiffre">
                        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
                            <path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
                            <path d="M14.5 9.5l-5 5m0-5l5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                        </svg>
                    </button>
                </div>
            </div>
        </section>

        <!-- ============ SCENE 3 : UNLOCK CELEBRATION ============ -->
        <section class="scene" id="scene-unlock" data-scene="unlock">
            <div class="unlock-stage">
                <div class="unlock-glow" aria-hidden="true"></div>
                <div class="character-slot" id="slot-unlock"></div>
                <div class="dialogue-box glass" id="unlock-dialogue-box">
                    <p class="dialogue-text" id="unlock-dialogue-text" aria-live="polite"></p>
                </div>
            </div>
        </section>

        <!-- ============ SCENE 4 : ENVELOPE PRESENTATION ============ -->
        <section class="scene" id="scene-present" data-scene="present">
            <div class="present-stage">
                <div class="character-slot" id="slot-present"></div>
                <div class="dialogue-box glass" id="present-dialogue-box">
                    <p class="dialogue-text" id="present-dialogue-text" aria-live="polite"></p>
                </div>
            </div>
        </section>

        <!-- ============ SCENE 5 : ENVELOPE OPEN ============ -->
        <section class="scene" id="scene-envelope" data-scene="envelope">
            <div class="envelope-stage">
                <p class="envelope-hint" id="envelope-hint">Touchez l'enveloppe pour l'ouvrir</p>
                <div class="envelope" id="envelope" role="button" tabindex="0" aria-label="Ouvrir l'enveloppe de Trinix">
                    <div class="envelope-cats" aria-hidden="true">🐱 🐾 🐱</div>
                    <div class="envelope-back"></div>
                    <div class="envelope-letter-peek"></div>
                    <div class="envelope-flap"></div>
                    <div class="envelope-front-left"></div>
                    <div class="envelope-front-right"></div>
                    <div class="envelope-seal">
                        <svg viewBox="0 0 32 29" aria-hidden="true">
                            <path d="M16 29 C16 29 0 18.5 0 8.7 C0 2.8 4.6 0 8.6 0 C12 0 14.7 2 16 4.8 C17.3 2 20 0 23.4 0 C27.4 0 32 2.8 32 8.7 C32 18.5 16 29 16 29Z"/>
                        </svg>
                    </div>
                </div>
            </div>
        </section>

        <!-- ============ SCENE 6 : LETTER ============ -->
        <section class="scene" id="scene-letter" data-scene="letter">
            <div class="letter-stage">
                <article class="paper" id="paper">
                    <div class="paper-decor paper-decor-tl" aria-hidden="true">🌹</div>
                    <div class="paper-decor paper-decor-tr" aria-hidden="true">🦋</div>
                    <div class="paper-decor paper-decor-bl" aria-hidden="true">🐱</div>
                    <div class="paper-decor paper-decor-br" aria-hidden="true">🌹</div>
                    <div class="paper-content">
                        <h2 class="paper-greeting">Mon Trinix ❤️</h2>
                        <div id="letter-text" class="paper-body"></div>
                    </div>
                </article>
                <button class="continue-btn" id="letter-continue">Continuer l'histoire ❤️</button>
            </div>
        </section>

        <!-- ============ SCENE 7 : SECRET HEART (easter egg) ============ -->
        <section class="scene" id="scene-secret" data-scene="secret">
            <canvas id="shatter-canvas" aria-hidden="true"></canvas>
            <div class="secret-stage">
                <p class="secret-hint" id="secret-hint">Écoutez votre cœur...</p>
                <button class="secret-heart" id="secret-heart" aria-label="Toucher le cœur secret">
                    <svg viewBox="0 0 32 29" class="secret-heart-svg" aria-hidden="true">
                        <path d="M16 29 C16 29 0 18.5 0 8.7 C0 2.8 4.6 0 8.6 0 C12 0 14.7 2 16 4.8 C17.3 2 20 0 23.4 0 C27.4 0 32 2.8 32 8.7 C32 18.5 16 29 16 29Z"/>
                    </svg>
                    <span class="secret-heart-names">ILara ❤️ Trinix</span>
                </button>
            </div>
        </section>

        <!-- ============ SCENE 8 : ENDING ============ -->
        <section class="scene" id="scene-ending" data-scene="ending">
            <div class="ending-stage">
                <div class="character-slot" id="slot-ending"></div>
                <div class="dialogue-box glass" id="ending-dialogue-box">
                    <p class="dialogue-text" id="ending-dialogue-text" aria-live="polite"></p>
                </div>
                <footer class="ending-title" id="ending-title">
                    <p class="ending-title-main">❤️ Pour Trinix ❤️</p>
                    <p class="ending-title-sub">Réalisé avec passion par ILara</p>
                </footer>
            </div>
        </section>
    </main>

    <!-- Audio Assets -->
    <audio id="bg-music" src="assets/music.mp3" loop preload="auto"></audio>
    <audio id="chime-sound" src="assets/chime.mp3" preload="auto"></audio>
    
    <button id="mute-btn" class="mute-btn" aria-label="Désactiver le son" aria-pressed="false">
        <span class="mute-icon">🔊</span>
    </button>

    <!-- ============ ILARA CHARACTER TEMPLATE ============ -->
    <template id="ilara-template">
        <svg class="ilara" id="ilara" viewBox="0 0 300 420" role="img" aria-label="Illustration de ILara">
            <defs>
                <linearGradient id="hairGrad" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#5a3a5e"/>
                    <stop offset="100%" stop-color="#3c2440"/>
                </linearGradient>
                <linearGradient id="dressGrad" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#f2b8cf"/>
                    <stop offset="100%" stop-color="#e191b3"/>
                </linearGradient>
                <radialGradient id="skinGrad" cx="45%" cy="35%" r="65%">
                    <stop offset="0%" stop-color="#ffe3ce"/>
                    <stop offset="100%" stop-color="#f6c9ab"/>
                </radialGradient>
            </defs>
            
            <!-- Hair Back -->
            <g class="ilara-hair-back">
                <path d="M95 120 C60 160 55 260 78 340 C88 358 108 360 110 340 C100 260 105 180 130 130 Z" fill="url(#hairGrad)"/>
                <path d="M205 120 C240 160 245 260 222 340 C212 358 192 360 190 340 C200 260 195 180 170 130 Z" fill="url(#hairGrad)"/>
            </g>

            <!-- Body / Dress -->
            <g class="ilara-body">
                <path d="M120 250 C120 235 180 235 180 250 L200 400 C200 412 100 412 100 400 Z" fill="url(#dressGrad)"/>
                <path d="M120 250 C120 235 180 235 180 250 L188 300 C150 315 150 315 112 300 Z" fill="#eea0c2"/>
                <circle class="ilara-necklace" cx="150" cy="255" r="4.5" fill="#e8c874" stroke="#c9a13f" stroke-width="1"/>
            </g>

            <!-- Arms -->
            <g class="ilara-arms">
                <g class="pose pose-envelope">
                    <path d="M118 268 C95 285 85 310 92 330" fill="none" stroke="url(#skinGrad)" stroke-width="16" stroke-linecap="round"/>
                    <path d="M182 268 C205 285 215 310 208 330" fill="none" stroke="url(#skinGrad)" stroke-width="16" stroke-linecap="round"/>
                    <g class="ilara-envelope" transform="translate(150,338)">
                        <rect x="-42" y="-28" width="84" height="56" rx="4" fill="#fbe9ef" stroke="#e8b4c8" stroke-width="2"/>
                        <path d="M-42 -28 L0 4 L42 -28" fill="none" stroke="#e8b4c8" stroke-width="2"/>
                        <text x="0" y="6" text-anchor="middle" font-size="16">🌹</text>
                    </g>
                </g>
                <g class="pose pose-present">
                    <path d="M110 265 C80 260 60 275 55 300" fill="none" stroke="url(#skinGrad)" stroke-width="16" stroke-linecap="round"/>
                    <path d="M190 265 C220 260 240 275 245 300" fill="none" stroke="url(#skinGrad)" stroke-width="16" stroke-linecap="round"/>
                    <g class="ilara-envelope" transform="translate(150,320) scale(1.15)">
                        <rect x="-42" y="-28" width="84" height="56" rx="4" fill="#fbe9ef" stroke="#e8b4c8" stroke-width="2"/>
                        <path d="M-42 -28 L0 4 L42 -28" fill="none" stroke="#e8b4c8" stroke-width="2"/>
                        <text x="0" y="6" text-anchor="middle" font-size="18">🌹</text>
                    </g>
                </g>
                <g class="pose pose-clap">
                    <path d="M120 265 C100 250 95 235 108 222" fill="none" stroke="url(#skinGrad)" stroke-width="16" stroke-linecap="round"/>
                    <path d="M180 265 C200 250 205 235 192 222" fill="none" stroke="url(#skinGrad)" stroke-width="16" stroke-linecap="round"/>
                </g>
                <g class="pose pose-rose">
                    <path d="M118 268 C98 280 90 300 95 318" fill="none" stroke="url(#skinGrad)" stroke-width="16" stroke-linecap="round"/>
                    <path d="M182 268 C202 280 210 300 205 318" fill="none" stroke="url(#skinGrad)" stroke-width="16" stroke-linecap="round"/>
                    <text x="150" y="335" text-anchor="middle" font-size="30">🌹</text>
                </g>
                <g class="pose pose-wave">
                    <path d="M118 268 C98 280 90 300 95 318" fill="none" stroke="url(#skinGrad)" stroke-width="16" stroke-linecap="round"/>
                    <path class="ilara-waving-arm" d="M182 268 C205 250 218 220 210 190" fill="none" stroke="url(#skinGrad)" stroke-width="16" stroke-linecap="round"/>
                </g>
            </g>

            <!-- Head -->
            <g class="ilara-head">
                <ellipse cx="150" cy="170" rx="62" ry="66" fill="url(#skinGrad)"/>
                <!-- Blush -->
                <ellipse cx="112" cy="192" rx="12" ry="7" fill="#f5a6c0" opacity=".55"/>
                <ellipse cx="188" cy="192" rx="12" ry="7" fill="#f5a6c0" opacity=".55"/>
                <!-- Eyes -->
                <g class="ilara-eye ilara-eye-left" transform="translate(122,165)">
                    <ellipse class="eye-white" cx="0" cy="0" rx="13" ry="14" fill="#fff"/>
                    <circle cx="1" cy="1" r="9" fill="#4f9d6e"/>
                    <circle cx="1" cy="1" r="4.2" fill="#1c2b1f"/>
                    <circle cx="-2.5" cy="-3" r="2.4" fill="#fff"/>
                    <path class="eyelid" d="M-14 0 Q0 0 14 0 L14 -15 Q0 -15 -14 -15 Z" fill="#f6c9ab"/>
                </g>
                <g class="ilara-eye ilara-eye-right" transform="translate(178,165)">
                    <ellipse class="eye-white" cx="0" cy="0" rx="13" ry="14" fill="#fff"/>
                    <circle cx="1" cy="1" r="9" fill="#4f9d6e"/>
                    <circle cx="1" cy="1" r="4.2" fill="#1c2b1f"/>
                    <circle cx="-2.5" cy="-3" r="2.4" fill="#fff"/>
                    <path class="eyelid" d="M-14 0 Q0 0 14 0 L14 -15 Q0 -15 -14 -15 Z" fill="#f6c9ab"/>
                </g>
                <!-- Eyebrows -->
                <path d="M106 144 Q122 136 138 144" fill="none" stroke="#4a2f4d" stroke-width="3" stroke-linecap="round"/>
                <path d="M162 144 Q178 136 194 144" fill="none" stroke="#4a2f4d" stroke-width="3" stroke-linecap="round"/>
                <!-- Nose -->
                <path d="M150 178 Q147 186 150 189" fill="none" stroke="#e0a988" stroke-width="2" stroke-linecap="round"/>
                <!-- Mouth -->
                <path class="ilara-mouth" d="M132 202 Q150 214 168 202" fill="none" stroke="#c25a72" stroke-width="3.4" stroke-linecap="round"/>
                <!-- Front Hair -->
                <path d="M92 140 C92 95 208 95 208 140 C208 118 185 108 150 108 C115 108 92 118 92 140 Z" fill="url(#hairGrad)"/>
                <path d="M100 132 C110 118 130 112 150 112 C170 112 190 118 200 132 C190 122 170 116 150 116 C130 116 110 122 100 132 Z" fill="#6d4771" opacity=".6"/>
            </g>
        </svg>
W aq 

    </template>

    <!-- Main Logic -->
    <script src="script.js" defer></script>
</body>
  </html>
